<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloomburrow Pack Opener</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow">Magic: The Gathering</p>
        <h1>Bloomburrow</h1>
        <p class="lede">Open a 15-card Play Booster. Cards stay local after the first Scryfall fetch.</p>
      </header>

      <p id="status" class="status" role="status">Loading card data…</p>

      <div class="actions">
        <button id="open-btn" type="button" disabled onclick="window.appOpenPack()">
          Open pack
        </button>
        <button id="reveal-btn" type="button" onclick="window.appRevealAll()">
          Reveal all
        </button>
      </div>

      <section id="pack" class="pack"></section>

      <footer class="site-footer">
        Card data and images from
        <a href="https://scryfall.com/" rel="noopener noreferrer">Scryfall</a>.
        Not affiliated with Wizards of the Coast or Scryfall.
      </footer>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
